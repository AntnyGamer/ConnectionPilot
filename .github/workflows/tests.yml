name: Test ConnectionPilot v1.0.6
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Install test browser
        run: python -m playwright install chromium
      - name: Scan repository for accidental private files
        run: python scripts/prepublish_check.py
      - name: Run offline browser and logic simulations
        run: python scripts/run_tests.py

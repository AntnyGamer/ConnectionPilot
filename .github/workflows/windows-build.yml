name: Build branded ConnectionPilot v1.1.0 (Windows)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: connectionpilot-exe-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install pinned runtime packages and PyInstaller
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt
      - name: Verify dependencies
        run: |
          python -m pip check
          python -c "from importlib.metadata import version; from bootstrap import pinned_dependencies; assert all(version(name) == wanted for name, wanted in pinned_dependencies().items()), 'Installed runtime packages do not match requirements.txt'; from pathlib import Path; build_pins = dict(line.split('==', 1) for line in Path('requirements-build.txt').read_text().splitlines() if line.strip()); assert all(version(name) == required for name, required in build_pins.items()), 'Installed build packages do not match requirements-build.txt'"
      - name: Install browser for offline tests
        run: python -m playwright install chromium
      - name: Run isolated test suite
        run: python scripts/run_tests.py
      - name: Check for private files
        run: python scripts/prepublish_check.py
      - name: Compare system Chrome launch from normal Python
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:RUNNER_TEMP 'empty-playwright-browsers'
          New-Item -ItemType Directory -Path $env:PLAYWRIGHT_BROWSERS_PATH -Force | Out-Null
          @'
          from tempfile import TemporaryDirectory
          from playwright.sync_api import sync_playwright
          from automation import choose_browser_channel, browser_launch_settings
          with sync_playwright() as p:
              channel = choose_browser_channel("chromium", p.chromium.executable_path)
              print("Selected channel:", channel, flush=True)
              with TemporaryDirectory(prefix="ConnectionPilot-control-") as temp:
                  profile, options = browser_launch_settings(temp, channel)
                  browser = p.chromium.launch_persistent_context(
                      profile, headless=True, chromium_sandbox=True,
                      timeout=20000, **options)
                  try:
                      page = browser.pages[0] if browser.pages else browser.new_page()
                      page.goto("about:blank", timeout=10000)
                      print("Normal Python Chrome/Edge launch passed", flush=True)
                  finally:
                      browser.close()
          '@ | python -
      - name: Build the branded EXE
        run: python scripts/build_windows.py
      - name: Verify embedded executable icon and metadata
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/ConnectionPilot.exe').Path
          $f = Get-Item $exe
          if ($f.VersionInfo.ProductName -ne 'ConnectionPilot' -or $f.VersionInfo.FileVersion -ne '1.1.0.0') { throw 'EXE version metadata is incorrect' }
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon -or $icon.Width -lt 16) { throw 'EXE has no usable icon' }
          Write-Host "Verified icon $($icon.Width)x$($icon.Height), product $($f.VersionInfo.ProductName)"
      - name: Smoke-test the actual packaged EXE offline
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/ConnectionPilot.exe').Path
          $result = Join-Path $env:RUNNER_TEMP 'connectionpilot-exe-smoke.txt'
          # Keep Windows' genuine USERPROFILE/LOCALAPPDATA values. Chrome's
          # remote-debugging startup can fail if only USERPROFILE is overridden.
          # The browser uses a separate TemporaryDirectory created by the EXE.
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:RUNNER_TEMP 'empty-playwright-browsers'
          New-Item -ItemType Directory -Path $env:PLAYWRIGHT_BROWSERS_PATH -Force | Out-Null
          $p = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', "`"$result`"") -PassThru
          if (-not $p.WaitForExit(120000)) {
            if (Test-Path $result) { Get-Content $result }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Packaged EXE did not complete its startup test within 120 seconds'
          }
          if (Test-Path $result) {
            Get-Content $result
          }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $result) -or
              -not (Select-String -Path $result -Pattern '^PASS v1.1.0:' -Quiet)) {
            throw "Packaged EXE startup smoke test failed with exit code $($p.ExitCode)"
          }
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: ConnectionPilot-v1.1.0-Windows-EXE
          path: dist/ConnectionPilot.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish verified Windows EXE release
    needs: build-windows-exe
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Check out the matching logo assets
        uses: actions/checkout@v7
      - name: Download verified Windows executable
        uses: actions/download-artifact@v8
        with:
          name: ConnectionPilot-v1.1.0-Windows-EXE
          path: release
      - name: Verify package and write checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s release/ConnectionPilot.exe
          cp assets/connectionpilot.png release/connectionpilot.png
          cp assets/connectionpilot.ico release/connectionpilot.ico
          test -s release/connectionpilot.png
          test -s release/connectionpilot.ico
          (cd release && sha256sum ConnectionPilot.exe > ConnectionPilot.exe.sha256)
          (cd release && sha256sum --check ConnectionPilot.exe.sha256)
      - name: Publish version v1.1.0 release automatically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Versioned release tags match the compiled app/EXE metadata.
          # If a tag already exists, do not silently replace a different binary.
          TAG="v1.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Keeping the immutable release unchanged; the new EXE remains available as a workflow artifact."
            exit 0
          fi
          # A leftover Git tag without a release could point to older source.
          # Do not publish a new EXE under an unrelated existing commit.
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists without a published release. Refusing to reuse it."
            exit 1
          fi
          gh release create "$TAG" \
            "release/ConnectionPilot.exe#ConnectionPilot v1.1.0 for Windows" \
            "release/ConnectionPilot.exe.sha256#SHA-256 checksum" \
            "release/connectionpilot.png#ConnectionPilot logo" \
            "release/connectionpilot.ico#Windows application icon" \
            --target "$GITHUB_SHA" --title "ConnectionPilot v1.1.0" --latest \
            --notes "ConnectionPilot v1.1.0 for Windows, built from commit $GITHUB_SHA. Reduces repeated keyword scoring and name normalization during profile discovery, simplifies advanced-filter processing, and fixes stale search-page cursors when searches change. Validated by offline Windows tests and a packaged executable startup smoke test. Unsigned; Windows SmartScreen may warn. Not endorsed or approved by LinkedIn."

name: Build branded ConnectionPilot v1 (Windows)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: connectionpilot-exe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install pinned runtime packages and PyInstaller
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.3
      - name: Verify dependencies
        run: |
          python -c "from importlib.metadata import version; assert version('playwright') == '1.64.1'; assert version('tzdata') == '2026.6'"
      - name: Install browser for offline tests
        run: python -m playwright install chromium
      - name: Run isolated test suite
        run: python scripts/run_tests.py
      - name: Check for private files
        run: python scripts/prepublish_check.py
      - name: Build the branded EXE
        run: python scripts/build_windows.py
      - name: Verify embedded executable icon and metadata
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/ConnectionPilot.exe').Path
          $f = Get-Item $exe
          if ($f.VersionInfo.ProductName -ne 'ConnectionPilot' -or $f.VersionInfo.FileVersion -ne '1.0.0.0') { throw 'EXE version metadata is incorrect' }
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon -or $icon.Width -lt 16) { throw 'EXE has no usable icon' }
          Write-Host "Verified icon $($icon.Width)x$($icon.Height), product $($f.VersionInfo.ProductName)"
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ConnectionPilot-v1-Windows-EXE
          path: dist/ConnectionPilot.exe
          if-no-files-found: error
          retention-days: 30
